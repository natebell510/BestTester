name: PR Gate

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-describe:
    if: github.event.pull_request.body == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate PR description
        uses: actions/github-script@v7
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });

            const stats = { added: 0, modified: 0, removed: 0 };
            const sections = { tests: [], pages: [], api: [], config: [], other: [] };

            for (const f of files) {
              stats[f.status === 'added' ? 'added' : f.status === 'removed' ? 'removed' : 'modified']++;
              const p = f.filename;
              const entry = `- \`${p}\` (+${f.additions} -${f.deletions})`;
              if (p.startsWith('tests/'))          sections.tests.push(entry);
              else if (p.startsWith('src/pages/'))  sections.pages.push(entry);
              else if (p.startsWith('src/api/'))    sections.api.push(entry);
              else if (p.match(/config|\.yml|\.json|\.env/)) sections.config.push(entry);
              else                                  sections.other.push(entry);
            }

            let body = `## Summary\n\n`;
            body += `**${files.length}** files changed `;
            body += `(${stats.added} added, ${stats.modified} modified, ${stats.removed} removed)\n\n`;

            const labels = { tests: '🧪 Tests', pages: '📄 Pages', api: '🔌 API', config: '⚙️ Config', other: '📦 Other' };
            for (const [key, items] of Object.entries(sections)) {
              if (items.length) body += `### ${labels[key]}\n${items.join('\n')}\n\n`;
            }

            body += `---\n*Auto-generated by PR Gate workflow*`;

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              body,
            });

  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify PR has required reviewer
        run: echo "PR opened — CODEOWNERS will auto-request review from @natebell510"
