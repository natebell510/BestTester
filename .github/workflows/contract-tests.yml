name: Contract Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * *'

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run contract tests
        run: npm run test:contracts
        env:
          TEST_ENV: staging
          ADMIN_USERNAME: ${{ secrets.ORANGEHRM_ADMIN_USERNAME || 'Admin' }}
          ADMIN_PASSWORD: ${{ secrets.ORANGEHRM_ADMIN_PASSWORD || 'admin123' }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 30

      - name: Publish test report
        if: always()
        uses: daghmi/action-junit-report@v1
        with:
          report_paths: 'test-results/junit.xml'
          fail_on_failure: true
          include_passed: false

      - name: Comment PR with results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const resultsFile = 'test-results/results.json';
            if (!fs.existsSync(resultsFile)) {
              console.log('No results file found');
              return;
            }
            const results = JSON.parse(fs.readFileSync(resultsFile, 'utf-8'));
            const passed = results.stats?.expected || 0;
            const failed = results.stats?.unexpected || 0;
            const body = `## Contract Test Results

            | Result | Count |
            |--------|-------|
            | ✅ Passed | ${passed} |
            | ❌ Failed | ${failed} |

            [View full report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
