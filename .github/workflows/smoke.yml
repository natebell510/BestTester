name: Smoke Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        id: smoke
        run: npm run test:smoke
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          CI: true

      - name: Comment PR with results
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## 🎭 Smoke Test Results\n';
            try {
              const results = JSON.parse(fs.readFileSync('reports/playwright-report/results.json', 'utf8'));
              const { expected, unexpected, skipped } = results.stats;
              body += `| ✅ Passed | ❌ Failed | ⏭ Skipped |\n|---|---|---|\n| ${expected} | ${unexpected} | ${skipped} |`;
              if (unexpected > 0) body += '\n\n> ⚠️ Smoke tests failed — merge blocked.';
            } catch {
              body += '_Could not parse results._';
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
